name: Análisis semántico

on:
  workflow_run:
    workflows: ["Limpieza y transformación de datos textuales"]
    types: [completed]
  workflow_dispatch: {}  # también lanzable a mano

jobs:
  analisis-semantico:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # margen amplio: si algún día hay texto nuevo real, puede tardar bastante
    # Solo se ejecuta si el disparo es manual, o si la ingesta financiera
    # terminó con éxito (nunca tras un fallo del paso anterior).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar el resto de dependencias
        run: pip install -r requirements-nlp.txt

      - name: Ejecutar el análisis semántico
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python src/04_analisis_semantico.py
